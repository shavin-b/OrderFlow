server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: orderflow-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:orderflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:orderflow_user}
    password: ${DB_PASSWORD:orderflow_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: OrderFlowHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

# WhatsApp Cloud API
whatsapp:
  api:
    base-url: https://graph.facebook.com/v20.0
    access-token: ${WHATSAPP_ACCESS_TOKEN:your_access_token_here}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:your_phone_number_id}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:your_verify_token}
    app-secret: ${WHATSAPP_APP_SECRET:your_app_secret}
    timeout-seconds: 30

# Security
security:
  api-keys: ${API_KEYS:dev-api-key-change-in-production}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /management
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: OrderFlow Backend
    version: 1.0.0
    description: WhatsApp Cloud API SaaS Backend

# Logging
logging:
  level:
    root: INFO
    com.orderflow: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  file:
    name: logs/orderflow.log
    max-size: 100MB
    max-history: 30
