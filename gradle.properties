# Project-wide Gradle settings.
# See: http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM heap size for the Gradle daemon.
# 2GB is recommended for Android projects with Firebase + multiple libraries.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle's configuration cache to speed up repeated builds.
org.gradle.configuration-cache=true

# Enable parallel project execution (useful for multi-module projects).
org.gradle.parallel=true

# Use AndroidX packages (required — the old android.support.* namespace is deprecated).
android.useAndroidX=true

# Makes each library's R class contain only IDs declared in that library,
# reducing compile-time errors and improving incremental build speed.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
